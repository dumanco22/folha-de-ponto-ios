name: Build iOS (.ipa não assinado para Sideloadly)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Selecionar o Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Instalar o XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto Xcode (project.yml -> .xcodeproj)
        run: xcodegen generate

      - name: Compilar sem assinatura (para SDK de iPhone)
        run: |
          xcodebuild \
            -project FolhaDePonto.xcodeproj \
            -scheme FolhaDePonto \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Empacotar o .ipa (não assinado)
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/FolhaDePonto.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERRO: não encontrei o .app compilado em $APP_PATH"
            find build -maxdepth 5 -iname "*.app"
            exit 1
          fi
          mkdir -p ipa/Payload
          cp -r "$APP_PATH" ipa/Payload/
          cd ipa
          zip -r ../FolhaDePonto.ipa Payload
          cd ..
          echo "Gerado FolhaDePonto.ipa:"
          ls -la FolhaDePonto.ipa

      - name: Publicar o .ipa como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: FolhaDePonto-ipa
          path: FolhaDePonto.ipa
          retention-days: 14
