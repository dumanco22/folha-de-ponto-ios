name: Build iOS (.ipa não assinado para Sideloadly)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Selecionar a versão mais recente do Xcode instalada no runner
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Instalar o XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto Xcode (project.yml -> .xcodeproj)
        run: xcodegen generate

      - name: Compilar sem assinatura (para SDK de iPhone)
        run: |
          xcodebuild \
            -project FolhaDePonto.xcodeproj \
            -scheme FolhaDePonto \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Empacotar o .ipa (não assinado)
        run: |
          set -e
          PRODUTOS_DIR="build/Build/Products/Release-iphoneos"
          APP_PATH=$(find "$PRODUTOS_DIR" -maxdepth 1 -iname "*.app" | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERRO: não encontrei nenhum .app compilado em $PRODUTOS_DIR"
            find build -maxdepth 5 -iname "*.app"
            exit 1
          fi
          echo "Encontrado: $APP_PATH"
          mkdir -p ipa/Payload
          cp -r "$APP_PATH" ipa/Payload/
          cd ipa
          zip -r ../FolhaDePonto.ipa Payload
          cd ..
          echo "Gerado FolhaDePonto.ipa:"
          ls -la FolhaDePonto.ipa

      - name: Publicar o .ipa como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: FolhaDePonto-ipa
          path: FolhaDePonto.ipa
          retention-days: 14
